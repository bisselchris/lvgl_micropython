name: Build LVGL MicroPython ESP32-S3 N16R8 Multi-LCD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Cloner le dépôt lvgl_micropython
        uses: actions/checkout@v4

      - name: Installer les dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake ninja-build libffi-dev libssl-dev dfu-util libusb-1.0-0 python3-pip python3-venv

      - name: Compiler le firmware avec ST7796 et ILI9488
        run: |
          set -e
          python3 make.py esp32 BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT DISPLAY=st7796 DISPLAY=ili9488 INDEV=xpt2046

      - name: Publier le firmware compilé
        uses: actions/upload-artifact@v4
        with:
          name: lvgl-micropython-esp32s3-n16r8-multilcd
          path: build/*.bin
