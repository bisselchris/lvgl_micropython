name: Build LVGL MicroPython ESP32-S3 N16R8

on:
  workflow_dispatch:
    inputs:
      display_driver:
        description: 'Pilote écran (ex: st7796, ili9486, st7789)'
        required: false
        default: 'st7796'
      touch_driver:
        description: 'Pilote tactile (ex: xpt2046, cst816s, gt911, ou laisser vide)'
        required: false
        default: 'xpt2046'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt lvgl_micropython
        uses: actions/checkout@v4

      - name: Installer les dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake ninja-build libffi-dev libssl-dev dfu-util libusb-1.0-0 python3-pip python3-venv

      - name: Préparer le module sdcard.py et son manifeste
        run: |
          mkdir -p custom_frozen
          curl -sSL https://githubusercontent.com -o custom_frozen/sdcard.py
          cat << 'EOF' > custom_frozen/manifest.py
          include("$(PORT_DIR)/boards/ESP32_GENERIC_S3/mpconfigboard.cmake")
          freeze("$(PORT_DIR)/boards/ESP32_GENERIC_S3/modules")
          freeze("custom_frozen", "sdcard.py")
          EOF

      - name: Compiler le firmware avec make.py (DIO + SPIRAM_OCT)
        run: |
          CMD="python3 make.py esp32 BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT FROZEN_MANIFEST=$(pwd)/custom_frozen/manifest.py"
          
          if [ -n "${{ github.event.inputs.display_driver }}" ]; then
            CMD="$CMD DISPLAY=${{ github.event.inputs.display_driver }}"
          fi
          
          if [ -n "${{ github.event.inputs.touch_driver }}" ]; then
            CMD="$CMD INDEV=${{ github.event.inputs.touch_driver }}"
          fi
          
          echo "Exécution de : $CMD"
          eval $CMD

      - name: Publier le fichier .bin compilé
        uses: actions/upload-artifact@v4
        with:
          name: lvgl-micropython-esp32s3-n16r8
          path: build/*.bin
