name: Build LVGL MicroPython ESP32-S3 N16R8

on:
  workflow_dispatch:
    inputs:
      display_driver:
        description: 'Pilote écran (ex: st7796, ili9486, st7789)'
        required: false
        default: 'st7796'
      touch_driver:
        description: 'Pilote tactile (ex: xpt2046, cst816s, gt911, ou laisser vide)'
        required: false
        default: 'xpt2046'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Cloner le dépôt lvgl_micropython
        uses: actions/checkout@v4

      - name: Installer les dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake ninja-build libffi-dev libssl-dev dfu-util libusb-1.0-0 python3-pip python3-venv

      - name: Compiler le firmware avec make.py
        run: |
          set -e
          ARGS="esp32 BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT"
          
          if [ -n "${{ github.event.inputs.display_driver }}" ]; then
            ARGS="$ARGS DISPLAY=${{ github.event.inputs.display_driver }}"
          fi
          
          if [ -n "${{ github.event.inputs.touch_driver }}" ]; then
            ARGS="$ARGS INDEV=${{ github.event.inputs.touch_driver }}"
          fi
          
          echo "Lancement de : python3 make.py $ARGS"
          python3 make.py $ARGS

      - name: Publier le firmware compilé
        uses: actions/upload-artifact@v4
        with:
          name: lvgl-micropython-esp32s3-n16r8
          path: build/*.bin
